providers:
  webSearchOrder:
    - exa
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
  autoThinkingMaxEffort: xhigh
  openai-codex:
    codeMode: "on"
symbolPreset: nerd
theme:
  dark: dark-catppuccin
setupVersion: 2
modelRoles:
  sol-med: openai-codex/gpt-5.6-sol:medium
  sol-high: openai-codex/gpt-5.6-sol:high
  terra-med: openai-codex/gpt-5.6-terra:medium
  terra-high: openai-codex/gpt-5.6-terra:high
  luna-med: openai-codex/gpt-5.6-luna:medium
  luna-high: openai-codex/gpt-5.6-luna:high
  DS-V4-flash-high: deepseek/deepseek-v4-flash-vision-exp:high
  fable-med: anthropic/claude-fable-5-1:medium
  opus-med: anthropic/claude-opus-5:medium
  default: openai-codex/gpt-5.6-sol:medium
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  task: openai-codex/gpt-5.6-terra:medium
  review: openai-codex/gpt-5.6-sol:high
  designer: openai-codex/gpt-5.6-terra:medium
  vision: openai-codex/gpt-5.6-sol:medium
  smol: openai-codex/gpt-5.6-luna:medium
  agents: openai-codex/gpt-5.6-luna:medium
  tiny: openai-codex/gpt-5.6-luna:low
  advisor: openai-codex/gpt-5.6-luna:medium
  commit: openai-codex/gpt-5.6-luna:low
  ox: openrouter/stealth/ox-alpha:high
colorBlindMode: false
statusLine:
  preset: nerd
  separator: powerline-thin
  contextLine: embedded
  transparent: true
  compactThinkingLevel: false
  showHookStatus: true
terminal:
  showProgress: true
tui:
  textSizing: true
  resizeScrollback: preserve
  codexResetFireworks: true
  hyperlinks: always
  tight: true
  imeSafeCursor: true
defaultThinkingLevel: low
autolearn:
  enabled: true
  autoContinue: true
memory:
  backend: local
plan:
  enabled: true
  defaultOnStartup: false
advisor:
  enabled: true
  syncBacklog: "1"
  immuneTurns: 1
task:
  agentModelOverrides:
    task: "@task"
    designer: "@designer"
    reviewer: "@review"
    security-reviewer: "@review"
    scout: "@agents"
    sonic: "@agents"
    librarian: "@smol"
    explainer: "@smol"
  agentAdvisor:
    task: "on"
  showResolvedModelBadge: true
  eager: default
  enableLsp: true
  maxRuntimeMs: 0
  prewalk: false
bash:
  patterns:
    - match: "*tmux-run*"
      approval: deny
    - match: tmux *
      approval: allow
    - match: uv run *
      approval: deny
    - match: uvx *
      approval: deny
    - match: pytest*
      approval: deny
    - match: npx pyright*
      approval: deny
    - match: pnpm *
      approval: deny
    - match: npm run*
      approval: deny
    - match: make *
      approval: deny
    - match: cargo *
      approval: deny
    - match: alembic *
      approval: deny
    - match: omp config set*
      approval: deny
    - match: rm -rf *
      approval: deny
    - match: sudo *
      approval: deny
    - match: mkfs *
      approval: deny
    - match: dd *
      approval: deny
    - match: git push --force*
      approval: deny
    - match: git reset --hard*
      approval: deny
    - match: "*prisma*reset*"
      approval: deny
    - match: git commit*
      approval: allow
    - match: git push*
      approval: allow
    - match: gh pr create*
      approval: allow
    - match: gt submit*
      approval: allow
    - match: gt create*
      approval: allow
    - match: git rebase*
      approval: prompt
    - match: docker compose down*
      approval: prompt
    - match: docker stop*
      approval: prompt
    - match: docker rm *
      approval: prompt
    - match: docker volume rm*
      approval: prompt
    - match: docker system prune*
      approval: prompt
    - match: "*prisma migrate*"
      approval: prompt
    - match: "*prisma db push*"
      approval: prompt
    - match: "*drizzle-kit push*"
      approval: prompt
    - match: "*supabase db reset*"
      approval: prompt
cycleOrder:
  - sol-med
  - sol-high
  - terra-med
  - terra-high
  - luna-med
  - luna-high
  - DS-V4-flash-high
  - fable-med
  - opus-med
hideThinkingBlock: true
composer:
  shape: pi
display:
  shimmer: kitt
  showTokenUsage: true
  cacheMissMarker: true
  hideToolActivity: false
externalThinking: false
treeFilterMode: default
tools:
  approvalMode: yolo
autoResume: true
startup:
  showSplash: true
update:
  channel: stable
branchSummary:
  enabled: true
edit:
  mode: hashline
readLineNumbers: false
read:
  renderMarkdown: true
  toolResultPreview: true
disabledProviders:
  - claude-plugins
disabledExtensions:
  - skill:vercel-react-best-practices
  - skill:apex
  - skill:datagouv-apis
  - skill:fix-pr-comments
  - skill:git-commit
  - skill:git-create-pr
  - skill:gitnexus-cli
  - skill:gitnexus-debugging
  - skill:gitnexus-exploring
  - skill:gitnexus-guide
  - skill:gitnexus-impact-analysis
  - skill:gitnexus-pr-review
  - skill:gitnexus-refactoring
  - skill:panes
  - skill:prompt-engineering-patterns
  - skill:prospection-gws
  - skill:react-doctor
  - skill:react-effect-refactor
dev:
  autoqaConsent: granted