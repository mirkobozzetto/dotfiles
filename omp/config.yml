bash:
  patterns:
    - match: "*tmux-run*"
      approval: deny
    - match: tmux *
      approval: allow
    - match: alembic *
      approval: deny
    - match: omp config set*
      approval: deny
    - match: rm -rf *
      approval: deny
    - match: sudo *
      approval: deny
    - match: mkfs *
      approval: deny
    - match: dd *
      approval: deny
    - match: git push --force*
      approval: deny
    - match: git reset --hard*
      approval: deny
    - match: "*prisma*reset*"
      approval: deny
    - match: git commit*
      approval: allow
    - match: git push*
      approval: allow
    - match: gh pr create*
      approval: allow
    - match: gt submit*
      approval: allow
    - match: gt create*
      approval: allow
    - match: git rebase*
      approval: prompt
    - match: docker compose down*
      approval: prompt
    - match: docker stop*
      approval: prompt
    - match: docker rm *
      approval: prompt
    - match: docker volume rm*
      approval: prompt
    - match: docker system prune*
      approval: prompt
    - match: "*prisma migrate*"
      approval: prompt
    - match: "*prisma db push*"
      approval: prompt
    - match: "*drizzle-kit push*"
      approval: prompt
    - match: "*supabase db reset*"
      approval: prompt
cycleOrder:
